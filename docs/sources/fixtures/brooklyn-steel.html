            /* =========================================================
   GLOBAL / BASE
   ========================================================= */
a {
    color: #8F181C;
}

ul {
    margin-left: 20px;
}

.c-heading-h1 {
    font-size: clamp(30px, 3.47222222vw, 54px);
}
.c-heading-h2 {
    font-size: clamp(25px, 3.35648148vw, 50px);
}
.c-heading-h3 {
    text-transform: none;
}

/* OneTrust cookie-settings link */
a.ot-sdk-show-settings {
    color: #ffffff;
    font-size: 18px;
}
a.ot-sdk-show-settings:hover {
    color: #0a58ca;
}
@media (min-width: 768px) {
    a.ot-sdk-show-settings {
        font-size: 20px;
    }
}

/* Callout component image sizing — used across multiple pages */
.c-callout__image-wrap {
    max-width: 290px;
}
.c-callout .c-callout__inner .c-callout__image {
    max-width: 290px;
}


/* =========================================================
   HEADER / NAVIGATION / LOCATION SELECT
   ========================================================= */
@media (min-width: 1024px) {
    .c-nav__list {
        justify-content: right;
    }
    .c-header {
        padding: 20px;
    }
    .c-header__logo {
        aspect-ratio: 147 / 143;
    }
    /* Location/venue picker (desktop) */
    .c-select,
    .c-select.is-open .c-select__toggle,
    .c-select__toggle {
        font-size: 20px;
        min-width: 247px;
        margin: 0 auto;
    }
}

@media (max-width: 767px) {
    header.c-header .c-select {
        font-size: 20px;
    }
    .c-select .c-select__label {
        font-size: 16px;
    }
    .c-select__toggle {
        gap: 10px;
    }
    .c-select.is-open .c-select__toggle,
    ul.c-select__list {
        width: auto;
        min-width: 100%;
        margin: 0 auto;
    }
}

.c-select.is-open .c-select__toggle {
    justify-content: start;
}

.c-axs-events-search__results--form {
    justify-content: center;
}

/* Move Calendar to 2nd position (after Search) in mobile hamburger nav only; desktop (1024px+) keeps default order */
@media (max-width: 1023px) {
    .js-nav-mobile .c-nav__search {
        order: -2; /* search stays first */
    }
    .js-nav-mobile li.c-nav__item:has(> a.c-nav__link[href*="/calendar" i]) {
        order: -1; /* calendar moves to second */
    }
}


/* =========================================================
   BUTTONS (global)
   ========================================================= */
@media (max-width: 767px) {
    .add-to-calendar-button::part(atcb-button) {
        padding: 0;
    }
}

/* Hides the arrow on "Coming Soon" buttons (keeps it on Buy Tickets / Get
   Tickets / everything else). CSS can't tell these buttons apart on its own
   — they all share the same class/markup and differ only by label text — so
   a companion script (bowery-hide-coming-soon-arrow.js) adds this class to
   any button whose label is "Coming Soon". This rule is just the visual
   half of that; add the script wherever custom JS is injected. */
.c-button--hide-arrow svg {
    display: none;
}

.c-axs-event-card__info a.c-button {
    white-space: nowrap;
    flex-shrink: 0;
}

/* Moved from "Our Venues" — this is global, not scoped to #page-our-venues */
@media (min-width: 1024px) {
    .c-button svg,
    .daterangepicker.show-calendar .drp-buttons .applyBtn svg,
    .daterangepicker.show-calendar .drp-buttons .cancelBtn svg {
        max-height: 1.1em;
        max-width: 1.5em;
    }
}

/* ===== Buy Tickets button + Add-to-Calendar icon =====
   Homepage always has room to be generous (42px button/icon, verified
   constant at every breakpoint) — the rules right below are unconditional
   and apply everywhere. Calendar is different: it reuses the exact same
   .c-calendar-item markup in TWO very different layouts — a spacious
   single/2-column list (mobile, and desktop down to 1199px) and a fixed
   7-day-per-row grid (1200px and up) where each day column is a hard
   140px wide, confirmed live at that exact breakpoint (site's own switch,
   1199px = list, 1200px = grid). 42px/18px fits fine in the list layout but
   overflows the 140px grid column, so Calendar gets its own smaller sizing
   above 1200px — see that block further down. */

/* Homepage's icon+button row already has align-items:center/flex-wrap:nowrap
   natively — no fix needed there, but pinned here defensively so this can't
   silently regress if the site's own CSS changes. */
.c-axs-event-card__info {
    align-items: center;
    flex-wrap: nowrap;
}

/* Add-to-Calendar icon's size is NOT controlled by the --atcb-button-size
   custom property (this file used to set that on Calendar's icon and it had
   zero effect) — it's hardcoded per-page inside the widget's own
   "stylelight" config, injected as a <style> tag inside the component's
   shadow DOM, which ignores that custom property entirely. ::part() is
   required to reach past the shadow boundary, and !important is required to
   beat those hardcoded shadow-internal values. */
.c-axs-event-card__info add-to-calendar-button::part(atcb-button) {
    height: 42px !important;
    width: 42px !important;
    padding: 8px !important;
}

/* The calendar glyph inside the icon is a background image drawn via ::after.
   Calendar's own stylelight config already scales it to 0.75x, which gives it
   comfortable breathing room inside the circle. Homepage's config never
   scaled it, so at the same box size the glyph reads as bigger/tighter
   ("less padding"). Matching Calendar's 0.75 scale on Homepage too — this is
   the look that was preferred. ::part()::after is required to reach the
   glyph itself; confirmed live that this combination actually re-scales it. */
.c-axs-event-card__info add-to-calendar-button::part(atcb-button)::after {
    transform: scale(0.75) !important;
}

/* ----- Calendar: list layout (mobile, and desktop up to 1199px) -----
   Plenty of room here (confirmed live: 480px+ available), so this matches
   Homepage's 42px/18px sizing. */
@media (max-width: 1199px) {
    /* Calendar's button naturally renders smaller than Homepage's: padding
       4px 10px / font-size 14px vs Homepage's 5px 14px / 18px (same 27px
       line-height both places). Bringing it in line with Homepage. */
    .c-calendar-item a.c-button--red {
        padding: 5px 14px;
        font-size: 18px;
    }

    /* .c-calendar-item__button-group never sets align-items, so it defaults
       to "stretch". The icon's natural box is taller than the button's, so
       stretch was forcing the BUTTON's whole visible pill to inflate up to
       ~54px to match the icon — this, not the padding above, is why the
       Calendar button looked taller than its icon. align-items:center makes
       both render at their own natural height instead of stretching.
       flex-wrap:nowrap guarantees they never wrap to separate lines. */
    .c-calendar-item__button-group {
        align-items: center;
        flex-wrap: nowrap;
    }

    .c-calendar-item add-to-calendar-button::part(atcb-button) {
        height: 42px !important;
        width: 42px !important;
        padding: 8px !important;
    }

    /* Calendar's "Buy Tickets" button was missing its arrow icon (present on
       Homepage's). The <svg> is in the markup on both pages, but Calendar's
       own CSS sets it to display:none here — restoring it. It inherits the
       18px font-size fix above the same way Homepage's does (both use
       "width/height: 1em" internally), so it renders at the same 18px size
       as Homepage's arrow with no extra sizing needed. */
    .c-calendar-item a.c-button--red svg {
        display: inline-block;
    }
}

/* ----- Calendar: weekly grid layout (1200px and up) -----
   Unlike the 140px-fixed impression from the first pass at this, the day
   column is actually fluid and keeps growing above 1200px — confirmed live:
   140px at 1200px, 170px at 1440px, 183px at 1600px, 195px at 1681px. So
   rather than one fixed compact size forever, there are two tiers below:
   a compact one sized for the tightest case (1200px) and a larger one for
   screens with genuinely more room (1600px+), each verified against its own
   worst case. A hidden ".c-button--red span" min-width of 97px (a site rule
   that keeps different button labels — "Buy Tickets"/"Sold Out"/"Coming
   Soon" — visually aligned) fights any attempt to shrink the button
   regardless of font-size in BOTH tiers, so it's overridden in both. */

/* 1200–1599px: the tight end. Fitting the arrow icon in at all here required
   trimming hard — 10px text, 2px padding, 22px icon. Verified live to fit
   within the 140px column on one line, arrow included, with no text wrap.
   Side padding bumped from 2px to 2px/3px (+1px each side) for a little more
   breathing room around the label — verified live against all ~390 events
   currently on the calendar at this width; +1px each side is the max this
   column can take before every card starts overflowing its track (tested up
   to +1.5px, which broke all of them). Two unusually busy days (5+ events
   stacked in one cell) already slightly overflow their column at the
   original 2px padding — a pre-existing layout limit on those specific
   high-volume days, not something this change causes; this padding bump
   makes their overflow marginally larger (no wrapping, still one line) but
   doesn't newly affect any other day. */
@media (min-width: 1200px) and (max-width: 1599px) {
    .c-calendar-item__button-group {
        align-items: center;
        flex-wrap: nowrap;
        gap: 2px;
    }

    .c-calendar-item a.c-button--red {
        padding: 2px 3px;
        font-size: 10px;
        line-height: 18px;
        white-space: nowrap;
    }

    .c-calendar-item a.c-button--red span {
        min-width: 0;
        width: auto;
    }

    .c-calendar-item a.c-button--red svg {
        display: inline-block;
    }

    .c-calendar-item add-to-calendar-button::part(atcb-button) {
        height: 22px !important;
        width: 22px !important;
        padding: 5px !important;
    }

    /* At 22px, the glyph's natural size (24x30, before Calendar's own 0.75
       scale) would barely fit inside the padding at all — the "not enough
       icon padding" issue. Scaling it down further to 0.35x leaves it
       clearly inset within the circle, matching the more-padded look asked
       for; confirmed visually at 4x zoom. */
    .c-calendar-item add-to-calendar-button::part(atcb-button)::after {
        transform: scale(0.35) !important;
    }
}

/* 1600px and up: noticeably more room (183px column at 1600px, the worst
   case for this tier — only gets roomier above that), so button/icon can
   step back up. Verified live at 1600px: fits on one line, arrow included,
   no text wrap. Side padding bumped from 3px/4px to 3px/5px (+1px each side)
   for a little more breathing room around the label — verified live against
   all ~390 events currently on the calendar at this width; +1px each side is
   the max this column can take before cards start overflowing their track
   (tested +2px, which overflows). */
@media (min-width: 1600px) {
    .c-calendar-item__button-group {
        align-items: center;
        flex-wrap: nowrap;
        gap: 3px;
    }

    .c-calendar-item a.c-button--red {
        padding: 3px 5px;
        font-size: 13px;
        line-height: 20px;
        white-space: nowrap;
    }

    .c-calendar-item a.c-button--red span {
        min-width: 0;
        width: auto;
    }

    .c-calendar-item a.c-button--red svg {
        display: inline-block;
    }

    .c-calendar-item add-to-calendar-button::part(atcb-button) {
        height: 28px !important;
        width: 28px !important;
        padding: 6px !important;
